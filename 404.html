<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eCON Club - 404 | Page Not Found</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/x-icon" href="./images/logo.png">

  <meta name="keywords" content="economics, finance, econ club, investment, market, economic theory" />
  <meta property="og:title" content="eCON Club – Exploring the World of Economics" />
  <meta property="og:description" content="A vibrant community for individuals passionate about the dynamic world of economics." />
  <meta property="og:image" content="https://economicsclubblog.vercel.app/images/banner.png" />
  <meta property="og:url" content="https://economicsclubblog.vercel.app" />
  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      color: #94a3b8;
      margin-bottom: 16px;
      padding: 0 10px;
    }

    #game-container {
      position: relative;
      width: min(90vw, 400px);
      height: min(90vw, 400px);
      border-radius: 12px;
      background: var(--secondary-bg);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Spinning "TAKE ME HOME" Button */
    #home-btn {
      display: none;
      position: absolute;
      padding: 12px 20px;
      background: #22c55e;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
      animation: spin 3s linear infinite;
      transform-origin: center center;
      white-space: nowrap;
      z-index: 10;
    }

    #home-btn:hover, #home-btn:active {
      animation-play-state: paused;
      background: #16a34a;
      scale: 1.08;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* On-screen Directional Pad (D-Pad) for Mobile */
    .controls-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(80vw, 200px);
      margin-top: 16px;
    }

    .dbtn {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.1s ease, transform 0.1s ease;
    }

    .dbtn:active {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(0.95);
    }

    .dbtn-up { grid-column: 2; }
    .dbtn-left { grid-column: 1; grid-row: 2; }
    .dbtn-down { grid-column: 2; grid-row: 2; }
    .dbtn-right { grid-column: 3; grid-row: 2; }

    .instructions {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <h1>🫪 404</h1>
  <p class="subtitle">Looks like you're lost! Guide the snake to unlock the exit.</p>

  <div id="game-container">
    <canvas id="snakeCanvas"></canvas>
    <a id="home-btn" href="/">TAKE ME HOME</a>
  </div>

  <!-- Mobile Touch Controls -->
  <div class="controls-pad">
    <button class="dbtn dbtn-up" id="btn-up" aria-label="Up"><i class="fa-solid fa-arrow-up"></i></button>
    <button class="dbtn dbtn-left" id="btn-left" aria-label="Left"><i class="fa-solid fa-arrow-left"></i></button>
    <button class="dbtn dbtn-down" id="btn-down" aria-label="Down"><i class="fa-solid fa-arrow-down"></i></button>
    <button class="dbtn dbtn-right" id="btn-right" aria-label="Right"><i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <p class="instructions">Use Arrow Keys, Screen Buttons, or Swipe to Move</p>

  <script>
const canvas = document.getElementById('snakeCanvas');
const ctx = canvas.getContext('2d');
const homeBtn = document.getElementById('home-btn');
const container = document.getElementById('game-container');

const gridSize = 32;
let tileCount = 20;

let lastMoveTime = 0;
const moveInterval = 200; // Controls snake speed without dropping frame rate

let snake = [{ x: 10, y: 10 }];
let dx = 1, dy = 0;
let food = { x: 5, y: 5 };
let score = 0;
const targetScore = 6;
let gameOver = false;

// Input buffer queue to process rapid taps instantly without dropping them
let inputBuffer = [];

// Responsive Canvas Resizing
function resizeCanvas() {
  const size = container.clientWidth;
  const dpr = window.devicePixelRatio || 1;

  // Set physical pixel dimensions (high resolution)
  canvas.width = size * dpr;
  canvas.height = size * dpr;

  // Keep display layout size constant in CSS
  canvas.style.width = `${size}px`;
  canvas.style.height = `${size}px`;

  // Scale drawing context so grid math (e.g., gridSize = 32) remains unchanged
  ctx.scale(dpr, dpr);

  tileCount = Math.floor(size / gridSize);
  draw();
}

window.addEventListener('resize', resizeCanvas);

function gameLoop(timestamp) {
  if (gameOver) return;

  // Only move grid position when moveInterval passes
  if (timestamp - lastMoveTime >= moveInterval) {
    if (inputBuffer.length > 0) {
      const nextDir = inputBuffer.shift();
      if (nextDir.x !== 0 && dx === 0) { dx = nextDir.x; dy = 0; }
      if (nextDir.y !== 0 && dy === 0) { dx = 0; dy = nextDir.y; }
    }

    updateSnake();
    if (checkCollision()) {
      resetGame();
    }
    lastMoveTime = timestamp;
  }

  draw(); // Draw every frame for fluid responsiveness
  requestAnimationFrame(gameLoop);
}

function queueDirection(newDx, newDy) {
  const lastInput = inputBuffer.length > 0 
    ? inputBuffer[inputBuffer.length - 1] 
    : { x: dx, y: dy };

  if (newDx !== -lastInput.x || newDy !== -lastInput.y) {
    if (inputBuffer.length < 3) {
      inputBuffer.push({ x: newDx, y: newDy });
    }
  }
}

function updateSnake() {
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };
  
  // Wrap around walls
  if (head.x < 0) head.x = tileCount - 1;
  if (head.x >= tileCount) head.x = 0;
  if (head.y < 0) head.y = tileCount - 1;
  if (head.y >= tileCount) head.y = 0;

  snake.unshift(head);

  // Check if food eaten
  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score >= targetScore) {
      revealHomeButton(food.x, food.y);
    } else {
      placeFood();
    }
  } else {
    snake.pop();
  }
}

function checkCollision() {
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
      return true;
    }
  }
  return false;
}

function placeFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
}

function revealHomeButton(x, y) {
  gameOver = true;
  const left = (x * gridSize) + (gridSize / 2);
  const top = (y * gridSize) + (gridSize / 2);

  homeBtn.style.left = `${left}px`;
  homeBtn.style.top = `${top}px`;
  homeBtn.style.display = 'block';
}

function resetGame() {
  snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
  dx = 1; 
  dy = 0;
  inputBuffer = [];
  score = 0;
  placeFood();
}

function draw() {
  // Clear screen
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Snake
  snake.forEach((part, index) => {
    if (index === 0) {
      // Draw Head Grid Base

      ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);

      // Draw FontAwesome Face Icon on Head Grid
      ctx.save();
      ctx.translate(part.x * gridSize + gridSize / 2, part.y * gridSize + gridSize / 2);
      
      // Rotate icon based on current movement direction
      let angle = 0;
      if (dx === 1) angle = 0;                  // Right
      else if (dx === -1) angle = Math.PI;     // Left
      else if (dy === 1) angle = Math.PI / 2;  // Down
      else if (dy === -1) angle = -Math.PI / 2;// Up
      ctx.rotate(angle);

      // Render FontAwesome Face (\uf118 = fa-smile)
      ctx.font = '400 24px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.fillStyle = '#00ff00';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🫪', 0, 0);
      ctx.restore();
    } else {
      // Draw Body Segments
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
    }
  });

  // Draw Target (Food)
  if (!gameOver) {
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize / 2,
      food.y * gridSize + gridSize / 2,
      gridSize / 2 - 1,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }
}

// Keyboard Controls
window.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp': 
      queueDirection(0, -1); 
      e.preventDefault();
      break;
    case 'ArrowDown': 
      queueDirection(0, 1); 
      e.preventDefault();
      break;
    case 'ArrowLeft': 
      queueDirection(-1, 0); 
      e.preventDefault();
      break;
    case 'ArrowRight': 
      queueDirection(1, 0); 
      e.preventDefault();
      break;
  }
});

// Pointer Events for D-Pad Buttons
const bindDpad = (id, x, y) => {
  const btn = document.getElementById(id);
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    queueDirection(x, y);
  });
};

bindDpad('btn-up', 0, -1);
bindDpad('btn-down', 0, 1);
bindDpad('btn-left', -1, 0);
bindDpad('btn-right', 1, 0);

// Swipe Controls on Canvas
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

canvas.addEventListener('touchend', e => {
  const touchEndX = e.changedTouches[0].screenX;
  const touchEndY = e.changedTouches[0].screenY;
  
  const diffX = touchEndX - touchStartX;
  const diffY = touchEndY - touchStartY;

  if (Math.abs(diffX) > Math.abs(diffY)) {
    if (Math.abs(diffX) > 20) queueDirection(diffX > 0 ? 1 : -1, 0);
  } else {
    if (Math.abs(diffY) > 20) queueDirection(0, diffY > 0 ? 1 : -1);
  }
}, { passive: true });

// Initialize Game
document.fonts.ready.then(() => {
  resizeCanvas();
  placeFood();
  gameLoop();
});
  </script>
</body>
</html>
