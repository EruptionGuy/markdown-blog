<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eCON Club - 404 | Page Not Found</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/x-icon" href="./images/logo.png">

  <meta name="keywords" content="economics, finance, econ club, investment, market, economic theory" />
  <meta property="og:title" content="eCON Club – Exploring the World of Economics" />
  <meta property="og:description" content="A vibrant community for individuals passionate about the dynamic world of economics." />
  <meta property="og:image" content="https://economicsclubblog.vercel.app/images/banner.png" />
  <meta property="og:url" content="https://economicsclubblog.vercel.app" />
  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      color: #94a3b8;
      margin-bottom: 16px;
      padding: 0 10px;
    }

    #game-container {
      position: relative;
      width: min(90vw, 400px);
      height: min(90vw, 400px);
      border-radius: 12px;
      background: var(--secondary-bg);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Spinning "TAKE ME HOME" Button */
    #home-btn {
      display: none;
      position: absolute;
      padding: 12px 20px;
      background: #22c55e;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
      animation: spin 3s linear infinite;
      transform-origin: center center;
      white-space: nowrap;
      z-index: 10;
    }

    #home-btn:hover, #home-btn:active {
      animation-play-state: paused;
      background: #16a34a;
      scale: 1.08;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* On-screen Directional Pad (D-Pad) for Mobile */
    .controls-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(80vw, 200px);
      margin-top: 16px;
    }

    .dbtn {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.1s ease, transform 0.1s ease;
    }

    .dbtn:active, .dbtn.active-key {
        background: #38bdf8;
        color: #0f172a;
        transform: scale(0.95);
    }

    .dbtn-up { grid-column: 2; }
    .dbtn-left { grid-column: 1; grid-row: 2; }
    .dbtn-down { grid-column: 2; grid-row: 2; }
    .dbtn-right { grid-column: 3; grid-row: 2; }

    .instructions {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <h1>🫪 404</h1>
  <p class="subtitle">Looks like you're lost! Guide the snake to unlock the exit.</p>

  <div id="game-container">
    <canvas id="snakeCanvas"></canvas>
    <a id="home-btn" href="/">TAKE ME HOME</a>
  </div>

  <!-- Mobile Touch Controls -->
  <div class="controls-pad">
    <button class="dbtn dbtn-up" id="btn-up" aria-label="Up"><i class="fa-solid fa-arrow-up"></i></button>
    <button class="dbtn dbtn-left" id="btn-left" aria-label="Left"><i class="fa-solid fa-arrow-left"></i></button>
    <button class="dbtn dbtn-down" id="btn-down" aria-label="Down"><i class="fa-solid fa-arrow-down"></i></button>
    <button class="dbtn dbtn-right" id="btn-right" aria-label="Right"><i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <p class="instructions">Use Arrow Keys, Screen Buttons, or Swipe to Move</p>

  <script>
    // Web Audio API Sound Effects Generator
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        try {
            initAudio();
            const now = audioCtx.currentTime;

            if (type === 'move') {
            // Soft, satisfying UI wood-block/bubble tap
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            
            // Gentle downward pitch drop starting at 440Hz (A4) down to 220Hz
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(220, now + 0.03);

            // Super quick, subtle volume decay (30ms) so it never gets annoying
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.03);

            } else if (type === 'eat') {
            // Retro 8-bit double-tone chime for eating the apple
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.06);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);

            } else if (type === 'win') {
            // Arpeggio fanfare chord when the exit button reveals
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const noteOsc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                noteOsc.type = 'sine';
                noteOsc.frequency.setValueAtTime(freq, now + index * 0.08);
                noteGain.gain.setValueAtTime(0.2, now + index * 0.08);
                noteGain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.25);
                noteOsc.connect(noteGain);
                noteGain.connect(audioCtx.destination);
                noteOsc.start(now + index * 0.08);
                noteOsc.stop(now + index * 0.08 + 0.25);
            });
            }
        } catch (e) {
            // Audio contexts blocked until user interaction
        }
    }
    
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const homeBtn = document.getElementById('home-btn');
    const container = document.getElementById('game-container');
    
    const gridSize = 32;
    let tileCount = 20;
    
    let lastMoveTime = 0;
    const moveInterval = 200;
    
    let snake = [{ x: 10, y: 10 }];
    let dx = 1, dy = 0;
    let food = { x: 5, y: 5 };
    let score = 0;
    const targetScore = 6;
    let gameOver = false;
    
    let inputBuffer = [];
    
    // Map keys to directional vectors and cached button elements
    const controls = {
      'ArrowUp':    { x: 0,  y: -1, btn: document.getElementById('btn-up') },
      'ArrowDown':  { x: 0,  y: 1,  btn: document.getElementById('btn-down') },
      'ArrowLeft':  { x: -1, y: 0,  btn: document.getElementById('btn-left') },
      'ArrowRight': { x: 1,  y: 0,  btn: document.getElementById('btn-right') }
    };
    
    // Responsive Canvas Resizing
    function resizeCanvas() {
      const size = container.clientWidth;
      const dpr = window.devicePixelRatio || 1;
    
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = `${size}px`;
      canvas.style.height = `${size}px`;
    
      ctx.scale(dpr, dpr);
      tileCount = Math.floor(size / gridSize);
      draw();
    }
    
    window.addEventListener('resize', resizeCanvas);
    
    function stepGame() {
        if (gameOver) return;

        // Process directional input instantly
        if (inputBuffer.length > 0) {
            const nextDir = inputBuffer.shift();
            if (nextDir.x !== 0 && dx === 0) { dx = nextDir.x; dy = 0; }
            if (nextDir.y !== 0 && dy === 0) { dx = 0; dy = nextDir.y; }
        }

        updateSnake();
        if (checkCollision()) {
            resetGame();
        }
    }
    
    function gameLoop(timestamp) {
        if (gameOver) return;

        // Normal automatic movement tick
        if (timestamp - lastMoveTime >= moveInterval) {
            stepGame();
            lastMoveTime = timestamp;
        }

        draw();
        requestAnimationFrame(gameLoop);
        }

        function queueDirection(newDx, newDy) {
        const lastInput = inputBuffer.length > 0 
            ? inputBuffer[inputBuffer.length - 1] 
            : { x: dx, y: dy };

        // Only turn if it's a valid 90-degree move
        if (newDx !== -lastInput.x || newDy !== -lastInput.y) {
            if (inputBuffer.length < 2) {
            inputBuffer.push({ x: newDx, y: newDy });
            
            playSound('move'); // Trigger movement audio
            stepGame();
            lastMoveTime = performance.now(); // Reset interval timer so it doesn't double-step
            }
        }
    }
    
    function updateSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      
      // Wrap around walls
      if (head.x < 0) head.x = tileCount - 1;
      if (head.x >= tileCount) head.x = 0;
      if (head.y < 0) head.y = tileCount - 1;
      if (head.y >= tileCount) head.y = 0;
    
      snake.unshift(head);
    
      if (head.x === food.x && head.y === food.y) {
        score++;
        if (score >= targetScore) {
          revealHomeButton(food.x, food.y);
        } else {
        playSound('eat');
          placeFood();
        }
      } else {
        snake.pop();
      }
    }
    
    function checkCollision() {
      for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
          return true;
        }
      }
      return false;
    }
    
    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }
    
    function revealHomeButton(x, y) {
      gameOver = true;
      playSound('win');
      homeBtn.style.left = `${(x * gridSize) + (gridSize / 2)}px`;
      homeBtn.style.top = `${(y * gridSize) + (gridSize / 2)}px`;
      homeBtn.style.display = 'block';
    }
    
    function resetGame() {
      snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
      dx = 1; 
      dy = 0;
      inputBuffer = [];
      score = 0;
      placeFood();
    }
    
    function draw() {
      // Clear screen
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    
      // Draw Snake
      snake.forEach((part, index) => {
        if (index === 0) {
          // Head     
          ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
    
          ctx.save();
          ctx.translate(part.x * gridSize + gridSize / 2, part.y * gridSize + gridSize / 2);
          
          let angle = 0;
          if (dx === 1) angle = 0;
          else if (dx === -1) angle = Math.PI;
          else if (dy === 1) angle = Math.PI / 2;
          else if (dy === -1) angle = -Math.PI / 2;
          ctx.rotate(angle);
          ctx.font = '24px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🫪', 0, 0);
          ctx.restore();
        } else {
          // Body
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        }
      });
    
      // Target (Food)
      if (!gameOver) {
        ctx.font = '24px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍎', food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);
       }
    }
    
    // Unified Keyboard Event Listeners
    window.addEventListener('keydown', e => {
      const dir = controls[e.key];
      if (dir) {
        e.preventDefault();
        queueDirection(dir.x, dir.y);
        if (dir.btn) dir.btn.classList.add('active-key');
      }
    });
    
    window.addEventListener('keyup', e => {
      const dir = controls[e.key];
      if (dir && dir.btn) {
        dir.btn.classList.remove('active-key');
      }
    });
    
    // Bind D-Pad Pointer Events
    Object.values(controls).forEach(({ x, y, btn }) => {
        if (btn) {
            btn.addEventListener('pointerdown', e => {
            e.preventDefault();
            queueDirection(x, y);
            btn.classList.add('active-key');
            });

            // Remove active style when releasing touch/click
            btn.addEventListener('pointerup', () => btn.classList.remove('active-key'));
            btn.addEventListener('pointerleave', () => btn.classList.remove('active-key'));
        }
    });
    
    // Canvas Touch Swipe Controls
    let touchStartX = 0, touchStartY = 0;
    
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    
    canvas.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
    
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > 20) queueDirection(diffX > 0 ? 1 : -1, 0);
      } else {
        if (Math.abs(diffY) > 20) queueDirection(0, diffY > 0 ? 1 : -1);
      }
    }, { passive: true });
    
    // Initialize Game
    resizeCanvas();
    placeFood();
    requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
